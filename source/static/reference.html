<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Справочник · Логистика гор. −480</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6fb5'/%3E%3Cpath d='M3 11h10M5 11V6h6v5' stroke='white' fill='none' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reference">
<main id="page">
<h1>Справочник</h1>
<div class="tabs" role="tablist" aria-label="Разделы справочника">
  <button type="button" class="tab on" role="tab" id="tabBtnParams" aria-selected="true" aria-controls="tabParams">Параметры</button>
  <button type="button" class="tab" role="tab" id="tabBtnDay" aria-selected="false" aria-controls="tabDay">Суточное планирование</button>
</div>
<div id="tabParams" role="tabpanel">
<p class="lead" id="refHint"></p>
<div class="card">
  <div class="row">
    <label>Поиск <input type="search" id="refFind" placeholder="название или примечание" size="30"></label>
    <label class="inline"><input type="checkbox" id="refChanged"> только изменённые</label>
    <label class="inline"><input type="checkbox" id="refAssume"> только допущения</label>
    <span class="msg" id="refCount" role="status"></span>
  </div>
  <div class="anchors" id="refAnchors"></div>
</div>
<div id="refBox"></div>
<div class="sticky-bar" id="refBtns" hidden>
  <button id="btnRefSave" class="btn primary" type="button">Сохранить</button>
  <button id="btnRefReset" class="btn" type="button">Вернуть значения по умолчанию</button>
  <span id="refDirty" class="msg"></span>
  <span id="refMsg" class="msg" role="status"></span>
</div>
</div>
<div id="tabDay" role="tabpanel" hidden>
  <p class="lead">Плановые показатели добычи руды и отгрузки породы вносятся вручную. Для каждой строки выбираются начало маршрута (точка отгрузки) и конец маршрута (точка разгрузки); плечо откатки рассчитывается автоматически по чертежам и справочнику блоков, при необходимости его можно задать вручную.</p>
  <div id="dayOut"></div>
</div>
</main>
<script src="js/blocks.js"></script>
<script src="js/drawings.js"></script>
<script src="js/plan480.js"></script>
<script src="js/dayplan.js"></script>
<script src="js/common.js"></script>
<script src="js/p-dayplan.js"></script>
<script src="js/p-reference.js"></script>
</body>
</html>
